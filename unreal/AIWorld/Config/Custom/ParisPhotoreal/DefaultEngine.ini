[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.RayTracing=False

[SystemSettings]
r.EyeAdaptation.CachedLightingPreExposure=8
r.Shadow.MaxResolution=2048
r.Lumen.HardwareRayTracing=0
r.MaxAnisotropy=16
; Sharper, steadier image: Temporal Super Resolution with a light sharpen, contact shadows for
; small props/people, and per-mesh distance-field tracing so Lumen GI/AO resolves facade detail.
r.AntiAliasingMethod=4
r.Tonemapper.Sharpen=0.6
r.ContactShadows=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.5
; All current Paris surfaces are opaque/masked and volumetric fog is disabled.
; Keep normal VSM receiver pages; avoid broad non-Nanite coarse-page renders.
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
